name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: install
        run: uv pip install -e '.[dev]' --system
      - name: tests
        run: pytest -q
      - name: recoverability gate
        run: python scripts/recoverability.py
      - name: demo
        run: python scripts/demo.py
