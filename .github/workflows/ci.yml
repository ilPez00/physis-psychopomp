name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: create environment from lockfile
        run: uv sync --locked --extra dev --python 3.12
      - name: every gate, in one command (the same one a human runs locally)
        run: .venv/bin/python scripts/verify-all.py
