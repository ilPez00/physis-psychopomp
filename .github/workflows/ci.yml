name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: install
        run: uv pip install -e '.[dev]'
      - name: tests
        run: .venv/bin/pytest -q
      - name: recoverability gate
        run: .venv/bin/python scripts/recoverability.py
      - name: probe baseline (M2/M3)
        run: .venv/bin/python scripts/probes.py
      - name: demo
        run: .venv/bin/python scripts/demo.py
