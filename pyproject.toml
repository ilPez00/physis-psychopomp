[project]
name = "psychopomp"
version = "0.4.0"
description = "Psychopomp v0.1 — CPU research probe: persistent, provenance-bearing world states feeding falsifiable constraints on learned representations"
requires-python = ">=3.10"
# v0.1 core (sim, event log, possible-world filter, controls) is stdlib-only.
# numpy/torch/clingo arrive with the GPU arms phase, pinned in REPRO.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "clingo>=5.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["psychopomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
